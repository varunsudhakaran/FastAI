<html lang="en">
    <head>
        <title>Pet classifier</title>
    </head>
    <body>
        <p>Upload a picture of a cat or a dog!</p>
        <p>This app will tell you if it is a cat or a dog.</p>
    </body>
</html>

<input id="photo" type="file">
<div id="results"></div>

<script type="module">
  import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

    photo.addEventListener("input", async () => {
        const file = photo.files[0];   // the blob (file)

        const client = await Client.connect("varuns17/DogClassifier");
        const result = await client.predict("/classify_image", {
            img: file,                 // send blob directly
        });

        const label0 = result.data[0].label;
        const prob0 = result.data[0].confidences[0].confidence;
        const label1 = result.data[0].confidences[1].label;
        const prob1 = result.data[0].confidences[1].confidence;
        console.log(result.data);
        // const label1 = result.data[1].label;
        // const prob1 = result.data[1].confidence;ß
        // const label2 = result.data[2].label;
        // const prob2 = result.data[2].confidence; 

        // show photo preview
        const url = URL.createObjectURL(file);
        results.innerHTML = `<br/><img src="${url}" width="300"> <p>This is a ${label0}!<br> This is my confidence: ${prob0?.toFixed(3)})</p><br>Less likely:<br>${label1}: ${prob1.toFixed(7)}<br>`;
});
</script>
